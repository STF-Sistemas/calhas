name: Deploy

# A cada push na main: compila backend e frontend, instala as dependências de produção no
# Linux e publica o resultado pronto na branch `deploy`, que é a que a Discloud usa.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build do backend
        run: |
          npm ci --prefix backend --include=dev --no-audit --no-fund
          npm run build --prefix backend

      - name: Build do frontend
        run: |
          npm ci --prefix frontend --include=dev --no-audit --no-fund
          npm run build --prefix frontend

      - name: Montar conteúdo da branch deploy
        run: node scripts/montar-deploy.mjs "$RUNNER_TEMP/deploy" --com-dependencias

      - name: Publicar na branch deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$RUNNER_TEMP/publicar"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" deploy >/dev/null 2>&1; then
            git clone --depth 1 --branch deploy "$URL" "$PUB"
          else
            git init -b deploy "$PUB"
            git -C "$PUB" remote add origin "$URL"
          fi
          find "$PUB" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/deploy/." "$PUB/"
          cd "$PUB"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --force
          if git diff --cached --quiet; then
            echo "Nada mudou na deploy."
            exit 0
          fi
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push origin deploy
