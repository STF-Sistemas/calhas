<ui-dialog
  [visible]="visible"
  (visibleChange)="!$event && onClose()"
  [header]="title"
  [estilo]="{ width: width, height: height }"
  [styleClass]="fullscreenMobile ? 'dialog-fullscreen-mobile' : ''"
  [position]="position"
  [maximizable]="true"
  (onShow)="show.emit()">
  @if (isLoadingData) {
    <div class="dialog-wrapper__carregando">
      <ui-spinner ariaLabel="Carregando dados" />
    </div>
  } @else {
    <ng-content />
  }

  @if (hasFooter) {
    <div rodape class="dialogo-rodape">
      <ui-button
        [label]="cancelLabel"
        icon="ic ic-times"
        [text]="true"
        severity="secondary"
        (onClick)="onClose()"
        [disabled]="isSaving"
        aria-label="Cancelar e fechar"
        styleClass="dialog-footer-btn" />
      <ui-button
        [label]="isSaving ? 'Salvando...' : saveLabel"
        icon="ic ic-check"
        [loading]="isSaving"
        severity="primary"
        (onClick)="save.emit()"
        [disabled]="saveDisabled"
        aria-label="Salvar alterações"
        styleClass="dialog-footer-btn" />
    </div>
  }
</ui-dialog>
