<p-dialog
    [(visible)]="visible"
    [modal]="true"
    [header]="title"
    [style]="{ width: width, height: height }"
    [contentStyle]="{ 'overflow-y': 'auto', 'flex': '1', 'min-height': '0', 'max-height': 'none' }"
    [breakpoints]="{ '960px': '95vw', '640px': '95vw' }"
    [styleClass]="fullscreenMobile ? 'dialog-fullscreen-mobile' : ''"
    [position]="position"
    [draggable]="false"
    [resizable]="false"
    [maximizable]="true"
    appendTo="body"
    (onHide)="onClose()"
    (onShow)="show.emit()">

    <!-- State: Loading -->
    @if (isLoadingData) {
        <div class="flex justify-content-center align-items-center p-5 min-h-10rem">
            <p-progressSpinner ariaLabel="Carregando dados"></p-progressSpinner>
        </div>
    } @else {
        <ng-content></ng-content>
    }

    <!-- Footer -->
    @if (hasFooter) {
        <ng-template pTemplate="footer">
            <div class="flex justify-content-end gap-2">
                <p-button
                    [label]="cancelLabel"
                    icon="pi pi-times"
                    [text]="true"
                    severity="secondary"
                    (onClick)="onClose()"
                    [disabled]="isSaving"
                    [pTooltip]="cancelLabel"
                    aria-label="Cancelar e fechar"
                    styleClass="dialog-footer-btn">
                </p-button>

                <p-button
                    [label]="isSaving ? 'Salvando...' : saveLabel"
                    [icon]="isSaving ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
                    severity="primary"
                    (onClick)="save.emit()"
                    [disabled]="isSaving || saveDisabled"
                    [pTooltip]="saveLabel"
                    aria-label="Salvar alterações"
                    styleClass="dialog-footer-btn">
                </p-button>
            </div>
        </ng-template>
    }
</p-dialog>
