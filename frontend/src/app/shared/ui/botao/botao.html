<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel() || label() || null"
  [attr.aria-busy]="loading() || null"
  (click)="onClick.emit($event)">
  @if (loading()) {
    <i class="ic ic-spinner ic-spin" aria-hidden="true"></i>
  } @else if (icon()) {
    <i [class]="icon()" aria-hidden="true"></i>
  }
  @if (label()) {
    <span class="ui-button__rotulo">{{ label() }}</span>
  }
  <ng-content />
</button>
