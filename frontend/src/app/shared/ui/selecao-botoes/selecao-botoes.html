<div class="ui-selecao-botoes" [class.ui-selecao-botoes--small]="size() === 'small'" role="group" [attr.aria-label]="ariaLabel() || null">
  @for (op of options() ?? []; track $index) {
    <button
      type="button"
      class="ui-selecao-botoes__opcao"
      [class.ui-selecao-botoes__opcao--ativa]="valorDe(op) === valor()"
      [attr.aria-pressed]="valorDe(op) === valor()"
      [disabled]="desabilitado() || op?.disabled"
      (click)="escolher(op, $event)">
      @if (itemTemplate(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: op }" />
      } @else {
        @if (op?.icon) {
          <i [class]="op.icon" aria-hidden="true"></i>
        }
        <span>{{ rotulo(op) }}</span>
      }
    </button>
  }
</div>
