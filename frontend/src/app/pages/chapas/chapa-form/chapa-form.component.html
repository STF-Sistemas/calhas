<app-dialog-wrapper
  [(visible)]="visible"
  [title]="chapaId ? 'Editar Chapa' : 'Nova Chapa'"
  [isLoadingData]="isLoadingData"
  [isSaving]="isSaving"
  [saveDisabled]="false"
  width="900px"
  position="top"
  (save)="onSave()">

  <form [formGroup]="form" appEnterNext>

    <h3 class="section-title">
      <i class="ic ic-th-large"></i>
      Dados da Chapa
    </h3>

    <div class="row">
      <div class="field col-12">
        <label for="descricao">Descrição da Chapa *</label>
        <input id="descricao" formControlName="descricao" placeholder="Ex: Chapa Galvalume 0,43mm" />
        @if (form.get('descricao')?.invalid && form.get('descricao')?.touched) {
          <small class="texto-erro">Descrição é obrigatória.</small>
        }
      </div>
    </div>

  </form>

  <h3 class="section-title mt-2">
    <i class="ic ic-list"></i>
    Cortes desta Chapa
    <ui-button label="Adicionar Corte" icon="ic ic-plus" [text]="true" severity="primary" size="small" (onClick)="adicionarCorte()" [style]="{'margin-left': 'auto'}">
    </ui-button>
  </h3>

  <ui-table [value]="cortesVisiveis" styleClass="ui-table--compacta">
    <ng-template #header>
      <tr>
        <th>Descrição *</th>
        <th style="width: 8rem">Corte (cm)</th>
        <th style="width: 10rem">Valor (R$) *</th>
        <th style="width: 4rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-corte>
      <tr>
        <td>
          <input [(ngModel)]="corte.descricao" class="ui-campo--pequeno w-full" placeholder="Descrição do corte" />
        </td>
        <td>
          <input appCurrencyMask [(ngModel)]="corte.corte" class="w-full" />
        </td>
        <td>
          <input appCurrencyMask [(ngModel)]="corte.valor" class="w-full" />
        </td>
        <td class="text-center">
          <ui-button icon="ic ic-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="removerCorte(corte)" aria-label="Remover corte">
          </ui-button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center p-3 text-600">
          Nenhum corte cadastrado.
        </td>
      </tr>
    </ng-template>
  </ui-table>

</app-dialog-wrapper>
