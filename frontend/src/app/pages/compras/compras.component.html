<main>
  <h1>Compras (Entrada de Estoque)</h1>

  <app-data-table
    [data]="compras"
    campoTituloCelular="fornecedor_nome"
    [columns]="cols"
    [loading]="loading"
    addButtonLabel="Nova Compra"
    [showExtraButton]="true"
    extraButtonIcon="ic ic-sync"
    extraButtonTooltip="Atualizar custo dos produtos com esta nota"
    extraButtonSeverity="info"
    [rowActions]="rowActions"
    (add)="onAdd()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (extraAction)="onAtualizarCusto($event)"
    (rowActionClick)="onRowAction($event)">
  </app-data-table>

  <app-compra-form #form (saved)="carregar()"></app-compra-form>

  <ui-dialog [(visible)]="showCancelDialog" [closable]="!isSavingStatus" header="Cancelar Compra" [estilo]="{ width: '480px' }">

    <div class="cancel-dialog-body">
      <p class="cancel-msg">
        Informe o motivo do cancelamento da compra
        @if (compraCancelando?.numero_nfe) {
          <strong>NF-e {{ compraCancelando!.numero_nfe }}</strong>
        } @else {
          <strong>#{{ compraCancelando?.id }}</strong>
        }.
      </p>
      <p class="cancel-aviso">
        <i class="ic ic-info-circle"></i>
        O estoque dos produtos será revertido após a confirmação.
      </p>
      <div class="field">
        <label for="motivo_cancelamento">Motivo <span class="required">*</span></label>
        <textarea id="motivo_cancelamento" [(ngModel)]="motivoCancelamento" [rows]="3" [maxlength]="500" class="w-full" placeholder="Descreva o motivo do cancelamento..." aria-label="Motivo do cancelamento">
        </textarea>
        <small class="char-count">{{ motivoCancelamento.length }}/500</small>
      </div>
    </div>

    <div rodape class="dialogo-rodape">
      <ui-button label="Voltar" icon="ic ic-arrow-left" severity="secondary" [text]="true" [disabled]="isSavingStatus" (onClick)="showCancelDialog = false" aria-label="Fechar dialog de cancelamento">
      </ui-button>
      <ui-button label="Confirmar Cancelamento" icon="ic ic-ban" severity="danger" [loading]="isSavingStatus" (onClick)="onConfirmarCancelamento()" aria-label="Confirmar cancelamento da compra">
      </ui-button>
    </div>
  </ui-dialog>

</main>
