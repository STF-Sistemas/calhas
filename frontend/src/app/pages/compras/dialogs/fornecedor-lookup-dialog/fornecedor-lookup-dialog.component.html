<ui-dialog [(visible)]="visible" [closable]="true" (onHide)="onDialogHide()" [estilo]="{ width: modo === 'opcoes' ? '400px' : '720px' }" [header]="modo === 'opcoes' ? 'Fornecedor não encontrado' : 'Selecionar Fornecedor'">

  @if (modo === 'opcoes') {
    <div class="opcoes">
      <p>O CNPJ <strong>{{ cnpj }}</strong> não está cadastrado. O que deseja fazer?</p>
      <div class="botoes">
        <ui-button label="Incluir Novo Fornecedor" icon="ic ic-plus" aria-label="Incluir novo fornecedor com este CNPJ" (onClick)="incluir()">
        </ui-button>
        <ui-button label="Relacionar Existente" icon="ic ic-link" severity="secondary" aria-label="Selecionar fornecedor já cadastrado" (onClick)="relacionar()">
        </ui-button>
        <ui-button label="Cancelar" icon="ic ic-times" severity="danger" [outlined]="true" aria-label="Cancelar busca de fornecedor" (onClick)="cancelar()">
        </ui-button>
      </div>
    </div>
  } @else {
    <div class="lookup-lista">
      <input [(ngModel)]="filtro" (ngModelChange)="filtrar()" placeholder="Filtrar por razão social ou CNPJ..." class="w-full mb-3" aria-label="Filtrar fornecedores" />

      <ui-table [value]="fornecedoresFiltrados" [paginator]="true" [rows]="8" [scrollable]="true" scrollHeight="300px">
        <ng-template #header>
          <tr>
            <th scope="col">CNPJ</th>
            <th scope="col">Razão Social</th>
            <th scope="col">Ação</th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td>{{ row.cnpj }}</td>
            <td>{{ row.razao_social }}</td>
            <td>
              <ui-button icon="ic ic-check" [rounded]="true" size="small" aria-label="Selecionar este fornecedor" (onClick)="selecionar(row)">
              </ui-button>
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <tr><td colspan="3">Nenhum fornecedor encontrado.</td></tr>
        </ng-template>
      </ui-table>
    </div>
  }
</ui-dialog>

@if (showForm) {
  <app-fornecedor-form
    #fornecedorForm
    [cnpjInicial]="cnpjParaForm"
    (saved)="onFornecedorSalvo($event)">
  </app-fornecedor-form>
}
