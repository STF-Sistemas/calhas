<ui-dialog [(visible)]="visible" [closable]="true" (onHide)="cancelar()" [estilo]="{ width: modo === 'opcoes' ? '400px' : '720px' }" [header]="modo === 'opcoes' ? 'Produto não encontrado' : 'Selecionar Produto'">

  @if (modo === 'opcoes') {
    <div class="opcoes">
      <p>O código <strong>{{ codigoDigitado }}</strong> não corresponde a nenhum produto cadastrado.</p>
      <div class="botoes">
        <ui-button label="Relacionar Produto Existente" icon="ic ic-link" aria-label="Selecionar produto já cadastrado" (onClick)="relacionar()">
        </ui-button>
        <ui-button label="Cancelar" icon="ic ic-times" severity="danger" [outlined]="true" aria-label="Cancelar busca de produto" (onClick)="cancelar()">
        </ui-button>
      </div>
    </div>
  } @else {
    <div class="lookup-lista">
      <input [(ngModel)]="filtro" (ngModelChange)="filtrar()" placeholder="Filtrar por descrição ou código..." class="w-full mb-3" aria-label="Filtrar produtos" />

      <ui-table [value]="produtosFiltrados" [paginator]="true" [rows]="8" [scrollable]="true" scrollHeight="300px">
        <ng-template #header>
          <tr>
            <th scope="col">Cód</th>
            <th scope="col">Descrição</th>
            <th scope="col">Un</th>
            <th scope="col">Ação</th>
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.descricao }}</td>
            <td>{{ row.unidade_medida }}</td>
            <td>
              <ui-button icon="ic ic-check" [rounded]="true" size="small" aria-label="Selecionar este produto" (onClick)="selecionar(row)">
              </ui-button>
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <tr><td colspan="4">Nenhum produto encontrado.</td></tr>
        </ng-template>
      </ui-table>
    </div>
  }
</ui-dialog>
