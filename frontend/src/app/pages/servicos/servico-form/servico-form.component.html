<app-dialog-wrapper
  [(visible)]="visible"
  [title]="servicoId ? 'Editar Serviço' : 'Novo Serviço'"
  [isLoadingData]="isLoadingData"
  [isSaving]="isSaving"
  [saveDisabled]="false"
  width="500px"
  position="top"
  (save)="onSave()">

  <form [formGroup]="form" appEnterNext>

    <h3 class="section-title">
      <i class="ic ic-wrench"></i>
      Dados do Serviço
    </h3>

    <div class="row">
      <div class="field col-12">
        <label for="descricao">Descrição do Serviço *</label>
        <input id="descricao" formControlName="descricao" placeholder="Ex: Instalação de Calhas (m)" />
        @if (form.get('descricao')?.invalid && form.get('descricao')?.touched) {
          <small class="texto-erro">Descrição é obrigatória.</small>
        }
      </div>
    </div>

    <div class="row">
      <div class="field col-12">
        <label for="valor">Valor Sugerido *</label>
        <input appCurrencyMask id="valor" formControlName="valor" class="w-full" />
        @if (form.get('valor')?.invalid && form.get('valor')?.touched) {
          <small class="texto-erro">Valor deve ser maior que zero.</small>
        }
        <small class="text-600" style="margin-top: 0.25rem;">Este valor pode ser alterado no momento do pedido.</small>
      </div>
    </div>

  </form>
</app-dialog-wrapper>
