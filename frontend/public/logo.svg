<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo arredondado laranja -->
  <rect width="32" height="32" rx="7" fill="#f97316"/>

  <!-- Perfil da calha (meia-cana) — traço branco grosso -->
  <path d="M5 12 L5 18 Q5 27 16 27 Q27 27 27 18 L27 12"
        stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bordas laterais (paredes da calha) -->
  <line x1="5" y1="12" x2="5" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="27" y1="12" x2="27" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Gotas de chuva caindo na calha -->
  <circle cx="12" cy="5.5" r="1.3" fill="white" opacity="0.75"/>
  <circle cx="16" cy="4"   r="1.4" fill="white" opacity="1"/>
  <circle cx="20" cy="5.5" r="1.3" fill="white" opacity="0.75"/>
</svg>
